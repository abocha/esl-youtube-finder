[project]
name = "esl-youtube-finder"
version = "3.1.4"
description = "ESL YouTube Finder: Find the perfect YouTube videos for your ESL students based on CEFR levels."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.187.0",
    "gradio>=5.49.1",
    "isodate>=0.7.2",
    "torch>=2.9.1",
    "transformers==4.49.0",
    "pytubefix>=10.3.4",
    "psutil>=7.1.3",
    "pytest>=9.0.1",
    "fpdf2>=2.8.5",
    "black>=25.11.0",
    "cefrpy>=1.0.1",
    "spacy>=3.8.11",
    "markitdown>=0.1.3",
    "huggingface-hub>=0.36.0",
    "youtube-transcript-api>=0.6.2",
    "yt-dlp[default]>=2024.11.0",
    "requests>=2.31.0",
    "curl-cffi>=0.5.10",
    "pandas>=2.0.0",
    "numpy",
    "accelerate>=0.26.0",
    "bitsandbytes>=0.48.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.1",
    "black>=25.11.0",
]
transcripts = [
    "supadata",  # Optional alternative transcript provider
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["finder"]

[tool.black]
line-length = 88
target-version = ['py312']

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
